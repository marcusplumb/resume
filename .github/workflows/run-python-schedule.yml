name: Scheduled Python jobs

on:
  schedule:
    # Every 5 minutes (minimum interval GitHub supports)
    - cron: "*/5 * * * *"

    # Every hour (UTC) — using minute 7 to avoid top-of-hour congestion
    - cron: "7 * * * *"

    # Every day (UTC) — pick any time you like
    - cron: "17 6 * * *"

  # Manual run button in Actions tab
  workflow_dispatch:
    inputs:
      run:
        description: "prices | thesis | daily | all"
        required: false
        default: "all"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          # If you keep requirements at repo root:
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

          # If you keep a separate one in scripts/:
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi

      - name: update_prices.py (every 5 minutes)
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *') ||
          (github.event_name == 'workflow_dispatch' && (inputs.run == 'prices' || inputs.run == 'all'))
        working-directory: scripts
        run: python update_prices.py

      - name: update_thesis_targets.py (every hour)
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '7 * * * *') ||
          (github.event_name == 'workflow_dispatch' && (inputs.run == 'thesis' || inputs.run == 'all'))
        working-directory: scripts
        run: python update_thesis_targets.py

      - name: update_fundamentals.py (daily)
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '17 6 * * *') ||
          (github.event_name == 'workflow_dispatch' && (inputs.run == 'daily' || inputs.run == 'all'))
        working-directory: scripts
        run: python update_fundamentals.py

      - name: rebalance_portfolio.py (daily)
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '17 6 * * *') ||
          (github.event_name == 'workflow_dispatch' && (inputs.run == 'daily' || inputs.run == 'all'))
        working-directory: scripts
        run: python rebalance_portfolio.py
