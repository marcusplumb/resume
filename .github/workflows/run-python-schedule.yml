name: Scheduled Python jobs

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
    - cron: "7 * * * *"     # hourly (minute 7)
    - cron: "17 6 * * *"    # daily (06:17 UTC)
  workflow_dispatch:
    inputs:
      run:
        description: "prices | thesis | daily | all"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (if present)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi

      - name: Debug (trigger + files)
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          pwd
          ls -la
          ls -la scripts || true

      - name: update_prices.py (every 5 minutes)
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *') ||
          (github.event_name == 'workflow_dispatch' && (inputs.run == 'prices' || inputs.run == 'all'))
        run: python scripts/update_prices.py

      - name: update_thesis_targets.py (hourly)
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '7 * * * *') ||
          (github.event_name == 'workflow_dispatch' && (inputs.run == 'thesis' || inputs.run == 'all'))
        run: python scripts/update_thesis_targets.py

      - name: update_fundamentals.py (daily)
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '17 6 * * *') ||
          (github.event_name == 'workflow_dispatch' && (inputs.run == 'daily' || inputs.run == 'all'))
        run: python scripts/update_fundamentals.py

      - name: rebalance_portfolio.py (daily)
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '17 6 * * *') ||
          (github.event_name == 'workflow_dispatch' && (inputs.run == 'daily' || inputs.run == 'all'))
        run: python scripts/rebalance_portfolio.py

      - name: Commit & push changes (if any)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Automated data update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "No changes to commit."
          fi
