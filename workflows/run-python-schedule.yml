name: Run Python periodically

on:
  schedule:
    # Runs at 9:00 AM Toronto time is NOT guaranteed (cron is UTC). This is 2:00 PM UTC during EST.
    # Pick your UTC time and adjust for daylight savings.
    - cron: "0 14 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run script
        env:
          # put secrets in repo Settings -> Secrets and variables -> Actions
          # EXAMPLE_API_KEY: ${{ secrets.EXAMPLE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/my_job.py
